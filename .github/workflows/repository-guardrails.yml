name: repository-guardrails

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repository-guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run repository guardrails
        run: make check
      - name: Summarize work ledger
        run: make list-work
