name: Lean proof backend

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  # Weekly source revalidation is scheduled away from the start of the hour,
  # where GitHub documents elevated delay risk. The maximum acceptable age of
  # successful no-binary-cache evidence is 14 days. GitHub may delay, drop, or
  # disable schedules, so reviewers and release processes must fail closed when
  # the latest successful main-branch run is older; this workflow does not make
  # its own historical run state immutable or self-verifying.
  schedule:
    - cron: "37 3 * * 3"

permissions:
  contents: read

concurrency:
  group: lean-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  EXPECTED_ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
  EXPECTED_LEAN_TOOLCHAIN: leanprover/lean4:v4.32.2
  EXPECTED_LEAN_COMMIT: f3b06c705e6c85f5314019d5d3baab0fec5b580c
  EXPECTED_LAKE_VERSION: 5.0.0-src+f3b06c7
  EXPECTED_MATHLIB_REVISION: 905b95818eb32af7874a58b427f50c1711a5e96c
  EXPECTED_MANIFEST_SHA256: c7e814b11c0e33ec8dd4e58bb31ea0999910bdb32848770dd5721f43eee7a14b

jobs:
  cached-build:
    name: Cached build and trust gates
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ELAN_HOME: ${{ github.workspace }}/../statqed-lean-cached/elan
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Record observed runner metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "runner.os=$RUNNER_OS"
          echo "runner.arch=$RUNNER_ARCH"
          echo "runner.name=$RUNNER_NAME"
          echo "image.os=${ImageOS:-unreported}"
          echo "image.version=${ImageVersion:-unreported}"
          cat /etc/os-release
          uname -a
          python3 --version
          # This is evidence for the observed hosted image, not an immutable
          # ubuntu-24.04 support or cross-platform compatibility claim.

      - name: Run repository guardrails
        run: make check

      - name: Validate reviewed toolchain and manifest pins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import tomllib

          root = Path("lean")
          expected_toolchain = os.environ["EXPECTED_LEAN_TOOLCHAIN"]
          expected_mathlib = os.environ["EXPECTED_MATHLIB_REVISION"]
          expected_manifest = os.environ["EXPECTED_MANIFEST_SHA256"]

          assert root.joinpath("lean-toolchain").read_text().strip() == expected_toolchain
          with root.joinpath("lakefile.toml").open("rb") as stream:
              lakefile = tomllib.load(stream)
          requirements = lakefile.get("require", [])
          mathlib_requirements = [
              item for item in requirements if item.get("name") == "mathlib"
          ]
          assert len(mathlib_requirements) == 1
          assert mathlib_requirements[0].get("rev") == expected_mathlib

          manifest_path = root / "lake-manifest.json"
          manifest_bytes = manifest_path.read_bytes()
          assert hashlib.sha256(manifest_bytes).hexdigest() == expected_manifest
          manifest = json.loads(manifest_bytes)
          packages = manifest.get("packages")
          assert isinstance(packages, list) and packages
          names = [item.get("name") for item in packages]
          assert len(names) == len(set(names))
          assert all(re.fullmatch(r"[0-9a-f]{40}", item.get("rev", "")) for item in packages)
          mathlib_packages = [item for item in packages if item.get("name") == "mathlib"]
          assert len(mathlib_packages) == 1
          assert mathlib_packages[0].get("inputRev") == expected_mathlib
          assert mathlib_packages[0].get("rev") == expected_mathlib
          PY

      - name: Install reviewed Elan and Lean
        shell: bash
        run: |
          set -euo pipefail
          installer_dir="$RUNNER_TEMP/statqed-lean-cached/installer"
          archive="$RUNNER_TEMP/statqed-lean-cached/elan.tar.gz"
          mkdir -p "$installer_dir"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "$EXPECTED_ELAN_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$installer_dir"
          "$installer_dir/elan-init" -y --no-modify-path --default-toolchain none
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
          "$ELAN_HOME/bin/elan" toolchain install "$EXPECTED_LEAN_TOOLCHAIN"

      - name: Validate installed tool identities
        shell: bash
        run: |
          set -euo pipefail
          elan --version
          lean_version="$(lean --version)"
          lake_version="$(lake --version)"
          echo "$lean_version"
          echo "$lake_version"
          [[ "$lean_version" == *"Lean (version 4.32.2,"* ]]
          [[ "$lean_version" == *"commit $EXPECTED_LEAN_COMMIT"* ]]
          [[ "$lake_version" == *"$EXPECTED_LAKE_VERSION"* ]]

      - name: Restore exact-lock Lean dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/.lake/packages
          # No prefix fallback: cache reuse is permitted only for this exact
          # toolchain/manifest pair on the observed runner OS and architecture.
          key: statqed-lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}

      - name: Regenerate and compare dependency manifest
        shell: bash
        run: |
          set -euo pipefail
          cp lean/lake-manifest.json "$RUNNER_TEMP/statqed-lean-cached/lake-manifest.committed.json"
          cd lean
          # The ordinary PR/push path may use Mathlib's reviewed binary cache as
          # a performance input. The immutable manifest remains authoritative.
          lake update --keep-toolchain
          cmp lake-manifest.json "$RUNNER_TEMP/statqed-lean-cached/lake-manifest.committed.json"

      - name: Build Lean project
        working-directory: lean
        run: lake build

      - name: Run smoke example at kernel trust level zero
        working-directory: lean
        run: lake env lean --trust=0 Examples/Smoke.lean

      - name: Run human-readable trust scan
        run: python3 scripts/check_lean_trust.py

      - name: Run machine-readable trust scan
        run: python3 scripts/check_lean_trust.py --json

      - name: Check live axiom report
        run: python3 lean/tools/axiom_report.py --check lean/Reports/axioms.json

      - name: Run trusted-path mutations
        run: python3 scripts/check_lean_trust.py --run-mutations

  source_gate:
    name: Select no-binary-cache revalidation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - name: Check out history for path comparison
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select scheduled, manual, or lock-changing run
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            from="$BASE_SHA"
            to="$HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            from="$BEFORE_SHA"
            to="$CURRENT_SHA"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$from" =~ ^[0-9a-f]{40}$ || ! "$to" =~ ^[0-9a-f]{40}$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$from" == "0000000000000000000000000000000000000000" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "${from}^{commit}" || ! git cat-file -e "${to}^{commit}"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$from" "$to" -- \
            lean/lean-toolchain lean/lakefile.toml lean/lake-manifest.json; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  no-binary-cache:
    name: Isolated source build and trust gates
    needs: source_gate
    if: needs.source_gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ELAN_HOME: ${{ github.workspace }}/../statqed-lean-source/elan
      XDG_CACHE_HOME: ${{ github.workspace }}/../statqed-lean-source/xdg-cache
      MATHLIB_NO_CACHE_ON_UPDATE: "1"
      LAKE_NO_CACHE: "1"
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Record observed runner metadata and cache policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$XDG_CACHE_HOME"
          echo "runner.os=$RUNNER_OS"
          echo "runner.arch=$RUNNER_ARCH"
          echo "runner.name=$RUNNER_NAME"
          echo "image.os=${ImageOS:-unreported}"
          echo "image.version=${ImageVersion:-unreported}"
          echo "MATHLIB_NO_CACHE_ON_UPDATE=$MATHLIB_NO_CACHE_ON_UPDATE"
          echo "LAKE_NO_CACHE=$LAKE_NO_CACHE"
          echo "XDG_CACHE_HOME=$XDG_CACHE_HOME"
          cat /etc/os-release
          uname -a
          python3 --version
          test ! -e lean/.lake
          # This is observed hosted-runner evidence, not immutable platform
          # support. The Lean release binaries remain installation provenance;
          # "no binary cache" here means no Mathlib or Lake build-output cache.

      - name: Run repository guardrails
        run: make check

      - name: Validate reviewed toolchain and manifest pins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import tomllib

          root = Path("lean")
          expected_toolchain = os.environ["EXPECTED_LEAN_TOOLCHAIN"]
          expected_mathlib = os.environ["EXPECTED_MATHLIB_REVISION"]
          expected_manifest = os.environ["EXPECTED_MANIFEST_SHA256"]

          assert root.joinpath("lean-toolchain").read_text().strip() == expected_toolchain
          with root.joinpath("lakefile.toml").open("rb") as stream:
              lakefile = tomllib.load(stream)
          requirements = lakefile.get("require", [])
          mathlib_requirements = [
              item for item in requirements if item.get("name") == "mathlib"
          ]
          assert len(mathlib_requirements) == 1
          assert mathlib_requirements[0].get("rev") == expected_mathlib

          manifest_path = root / "lake-manifest.json"
          manifest_bytes = manifest_path.read_bytes()
          assert hashlib.sha256(manifest_bytes).hexdigest() == expected_manifest
          manifest = json.loads(manifest_bytes)
          packages = manifest.get("packages")
          assert isinstance(packages, list) and packages
          names = [item.get("name") for item in packages]
          assert len(names) == len(set(names))
          assert all(re.fullmatch(r"[0-9a-f]{40}", item.get("rev", "")) for item in packages)
          mathlib_packages = [item for item in packages if item.get("name") == "mathlib"]
          assert len(mathlib_packages) == 1
          assert mathlib_packages[0].get("inputRev") == expected_mathlib
          assert mathlib_packages[0].get("rev") == expected_mathlib
          PY

      - name: Install reviewed Elan and Lean in the isolated tool directory
        shell: bash
        run: |
          set -euo pipefail
          installer_dir="$RUNNER_TEMP/statqed-lean-source/installer"
          archive="$RUNNER_TEMP/statqed-lean-source/elan.tar.gz"
          mkdir -p "$installer_dir" "$XDG_CACHE_HOME"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "$EXPECTED_ELAN_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$installer_dir"
          "$installer_dir/elan-init" -y --no-modify-path --default-toolchain none
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
          "$ELAN_HOME/bin/elan" toolchain install "$EXPECTED_LEAN_TOOLCHAIN"

      - name: Validate installed tool identities
        shell: bash
        run: |
          set -euo pipefail
          elan --version
          lean_version="$(lean --version)"
          lake_version="$(lake --version)"
          echo "$lean_version"
          echo "$lake_version"
          [[ "$lean_version" == *"Lean (version 4.32.2,"* ]]
          [[ "$lean_version" == *"commit $EXPECTED_LEAN_COMMIT"* ]]
          [[ "$lake_version" == *"$EXPECTED_LAKE_VERSION"* ]]

      - name: Regenerate locked dependencies without build-output caches
        shell: bash
        run: |
          set -euo pipefail
          cp lean/lake-manifest.json "$RUNNER_TEMP/statqed-lean-source/lake-manifest.committed.json"
          cd lean
          test ! -e .lake
          lake update --keep-toolchain
          cmp lake-manifest.json "$RUNNER_TEMP/statqed-lean-source/lake-manifest.committed.json"

      - name: Build Lean project from source
        working-directory: lean
        run: lake build

      - name: Run smoke example at kernel trust level zero
        working-directory: lean
        run: lake env lean --trust=0 Examples/Smoke.lean

      - name: Run human-readable trust scan
        run: python3 scripts/check_lean_trust.py

      - name: Run machine-readable trust scan
        run: python3 scripts/check_lean_trust.py --json

      - name: Check live axiom report
        run: python3 lean/tools/axiom_report.py --check lean/Reports/axioms.json

      - name: Run trusted-path mutations
        run: python3 scripts/check_lean_trust.py --run-mutations
