    {"name": "arrow_current_release", "class": "source_explicit", "source_anchor": "https://github.com/apache/arrow/releases/tag/apache-arrow-25.0.0", "notes": "Immutable release dated 2026-07-10, short tag commit 59bea6e."},
    {"name": "pyarrow_exact_candidate", "class": "source_explicit", "source_anchor": "https://pypi.org/project/pyarrow/25.0.0/", "notes": "PyPI records release 25.0.0 dated 2026-07-10, Apache-2.0, Requires-Python >=3.10, and wheels for explicitly listed interpreter/platform combinations. The executed wheel hash is separate prototype evidence."},
    {"name": "arrow_rs_exact_candidate", "class": "source_explicit", "source_anchor": "https://crates.io/crates/arrow/59.1.0", "notes": "Official crates.io metadata records arrow 59.1.0, Apache-2.0, rust-version 1.85, Edition 2024, repository apache/arrow-rs, publication 2026-07-07, and immutable crate checksum b952ca5a8046ad741b60f142d6eca4aeebcad615694202bc64c5341f23e32c5b."},
    {"name": "format_library_versions_are_separate", "class": "source_explicit", "source_anchor": "https://arrow.apache.org/docs/format/Versioning.html#format-and-library-versioning", "notes": "Libraries use semantic versions; Arrow format has its own version identifiers and compatibility rules."},
    {"name": "all_bindings_have_same_features", "class": "strengthening_unjustified", "source_anchor": "https://arrow.apache.org/docs/status.html", "notes": "The official status table has materially different Rust and Julia coverage, including Julia gaps for multiple types, C interfaces, and Parquet."},
    {"name": "pyarrow_and_arrow_rs_are_independent_authorities", "class": "strengthening_unjustified", "source_anchor": "https://github.com/apache/arrow-rs/tree/59.1.0", "notes": "They are separately implemented C++/Python and Rust code lineages, useful for differential testing, but both are Apache Arrow projects. That is not organizationally independent oracle provenance."},
    {"name": "untrusted_arrow_is_safe_without_validation", "class": "strengthening_unjustified", "source_anchor": "https://arrow.apache.org/docs/format/Security.html", "notes": "Arrow warns invalid data may crash or leak data and explicitly recommends validation; the C Data Interface must not be consumed from an untrusted producer."},
    {"name": "arrow_defines_statqed_logical_identity", "class": "not_applicable", "source_anchor": "", "notes": "Arrow is a candidate transport. StatQED's logical-data identity and digest domain are separate project semantics."},
    {"name": "binding_round_trip_preserves_project_values", "class": "formalization_obligation", "source_anchor": "", "notes": "Requires typed cross-language fixtures and byte/log evidence for the exact chosen subset."},
    {"name": "repeat_equal_bytes_are_canonical", "class": "strengthening_unjustified", "source_anchor": "", "notes": "Repeatability in one process/build is only an observable prototype result. Neither registry metadata nor the format source promotes it to canonical StatQED bytes."}
