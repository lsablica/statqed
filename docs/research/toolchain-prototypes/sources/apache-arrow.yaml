  "controlled_statement": "Apache Arrow 25.0.0 and its PyArrow 25.0.0 distribution were current release candidates observed at the original cutoff. PyPI identifies PyArrow 25.0.0 as Apache-2.0, requiring Python >=3.10, and as the Python API over Arrow C++. crates.io identifies the separately versioned native Rust arrow crate 59.1.0 as Apache-2.0, Edition 2024, rust-version 1.85, and checksum b952ca5a8046ad741b60f142d6eca4aeebcad615694202bc64c5341f23e32c5b. Arrow format versioning is independent from library versions, and implementation coverage differs by language. A prototype can establish only behavior for the exact locked libraries, features, fixtures, and host; it cannot establish StatQED logical-data identity, canonical digests, scientific semantics, or a fully independent oracle.",
