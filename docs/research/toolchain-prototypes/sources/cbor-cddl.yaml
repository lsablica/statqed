{
  "audit_id": "SA-SQ0002-CBOR-CDDL",
  "subject": "CBOR deterministic encoding and CDDL schema/tool candidates",
  "source": {
    "work": "RFC 8949, RFC 8610, RFC 9682, and candidate implementation documentation",
    "version": "STD 94 / RFC 8949; RFC 8610 updated by RFC 9682; library observations retrieved 2026-08-03",
    "locator": "https://www.rfc-editor.org/rfc/rfc8949.html#section-4.2; https://www.rfc-editor.org/rfc/rfc8610.html; https://www.rfc-editor.org/rfc/rfc9682.html",
    "persistent_id": "RFC 8949; RFC 8610; RFC 9682"
  },
  "controlled_statement": "RFC 8949 defines multiple deterministic-encoding variants. The project must select a byte-level profile explicitly and test candidate implementations against it. CDDL validates data shape but does not itself choose deterministic CBOR bytes; Internet-Draft CDDL modules are not accepted standards.",
  "hypotheses": [
    {"name": "core_deterministic_requirements", "class": "source_explicit", "source_anchor": "https://www.rfc-editor.org/rfc/rfc8949.html#section-4.2.1", "notes": "Preferred shortest encodings, no indefinite lengths, and bytewise lexicographic ordering of deterministic map-key encodings."},
    {"name": "length_first_variant", "class": "source_explicit", "source_anchor": "https://www.rfc-editor.org/rfc/rfc8949.html#section-4.2.3", "notes": "Length-first ordering is a distinct variant retained for compatibility with older canonical CBOR."},
    {"name": "canonical_means_one_profile", "class": "strengthening_unjustified", "source_anchor": "https://www.rfc-editor.org/rfc/rfc8949.html#section-4.2", "notes": "RFC 8949 explicitly permits protocol-specific deterministic rules and documents different ordering variants."},
    {"name": "cddl_implies_canonical_bytes", "class": "strengthening_unjustified", "source_anchor": "https://www.rfc-editor.org/rfc/rfc8610.html#section-2", "notes": "CDDL is a data-definition language; deterministic serialization remains a separate byte-level rule."},
    {"name": "cddl_modules_are_standard", "class": "strengthening_unjustified", "source_anchor": "https://datatracker.ietf.org/doc/draft-ietf-cbor-cddl-modules/", "notes": "draft-ietf-cbor-cddl-modules-06 was an Internet-Draft in March 2026, not an RFC."},
    {"name": "ciborium_matches_core_deterministic", "class": "strengthening_unjustified", "source_anchor": "https://docs.rs/ciborium/latest/src/ciborium/value/canonical.rs.html", "notes": "CanonicalValue explicitly implements RFC 8949 §4.2.3 length-first ordering, not §4.2.1 core deterministic ordering."},
    {"name": "cbor2_canonical_variant", "class": "formalization_obligation", "source_anchor": "https://cbor2.readthedocs.io/en/stable/api.html#cbor2.dumps", "notes": "canonical=True promises sorted/canonical output but the API page does not identify §4.2.1 versus §4.2.3; verify with discriminating vectors."},
    {"name": "decoder_profile", "class": "formalization_obligation", "source_anchor": "https://cbor2.readthedocs.io/en/latest/versionhistory.html#version-history", "notes": "cbor2 6.1 allows duplicate keys by default and supports indefinite items; project profile must set duplicate, indefinite-length, and depth rules explicitly."},
    {"name": "serde_cbor_maintenance", "class": "source_explicit", "source_anchor": "https://github.com/pyfisch/cbor#readme", "notes": "Repository archived 2021-08-15; README says it is unmaintained and recommends ciborium or minicbor."}
  ],
  "variants": [
    {"name": "map_key_order", "source_variant": "RFC 8949 §4.2.1 bytewise lexicographic", "controlled_variant": "RFC 8949 §4.2.3 encoded-length first then bytewise", "reason": "Both are documented deterministic variants and produce different bytes for some maps."},
    {"name": "candidate_encoder", "source_variant": "ciborium 0.2.2 CanonicalValue uses length-first", "controlled_variant": "minicbor 2.3.0 exposes low-level encoding without an evidenced matching canonical profile", "reason": "Neither may be treated as a semantic oracle without profile-specific tests or controlled encoding logic."},
    {"name": "cddl_feature_status", "source_variant": "RFC 8610 plus RFC 9682", "controlled_variant": "draft module/freezer features accepted by tools", "reason": "Pin tool features and do not promote implemented drafts to standards."}
  ],
  "concept_mapping": [
    {"source_concept": "deterministic encoding", "project_concept": "candidate canonical artifact bytes", "caveat": "The project must additionally freeze numeric representations, tags, duplicate-key behavior, validity, and application constraints."},
    {"source_concept": "CDDL validation", "project_concept": "candidate schema gate", "caveat": "Schema acceptance is not byte canonicality or semantic validity."}
  ],
  "quantifiers": ["Conformance must cover every accepted artifact, not only fixture examples."],
  "randomness_scopes": [],
