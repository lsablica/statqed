  "controlled_statement": "Rust 1.97.1 was the current stable point release observed on 2026-08-03 and is the exact proposed development toolchain. Rust 1.85.1, at rustc commit 4eb161250e340c8f48f66e2b929ef4a5bed7c181 with Cargo commit d73d2caf9e41a39daf2a8d6ce60ec80bf354d2a7, is the exact compatibility-floor candidate. Cargo package.rust-version expresses a supported minimum but can be bypassed, and Rust upstream supplies fixes only to the latest release. The official Rust Security Response Team states that Cargo versions shipped before Rust 1.96 are affected by CVE-2026-5223 and Cargo 1.68 through pre-1.96 by CVE-2026-5222; therefore a successful 1.85.1 workspace build is not approval to use its bundled Cargo against untrusted or third-party registries. Rust 1.96.1 additionally fixed CVE-2025-15661, CVE-2026-55199, and CVE-2026-55200 in libssh2 compiled into Cargo. Development pin, compiler/API support floor, dependency resolver, package-fetch bootstrap, and CI matrix remain separate decisions.",
  "hypotheses": [
    {"name": "rust_current_stable", "class": "source_explicit", "source_anchor": "https://blog.rust-lang.org/2026/07/16/Rust-1.97.1/", "notes": "Released 2026-07-16; fixes an LLVM miscompilation present since at least Rust 1.87. Installed evidence identifies rustc commit 8bab26f4f68e0e26f0bb7960be334d5b520ea452 and Cargo commit c980f4866141969fab6254a680546a277789d6f0."},
    {"name": "cargo_matching_release", "class": "source_explicit", "source_anchor": "https://doc.rust-lang.org/cargo/CHANGELOG.html#cargo-197-2026-07-09", "notes": "Cargo documentation identifies the 1.97 line; exact installed cargo -V evidence records c980f4866141969fab6254a680546a277789d6f0."},
    {"name": "rust_1_85_1_release_identity", "class": "source_explicit", "source_anchor": "https://github.com/rust-lang/rust/releases/tag/1.85.1", "notes": "The official release tag resolves to rustc commit 4eb161250e340c8f48f66e2b929ef4a5bed7c181. Exact prototype output separately records Cargo 1.85.1 at d73d2caf9e41a39daf2a8d6ce60ec80bf354d2a7."},
    {"name": "statqed_rust_1_85_1_floor_selection", "class": "formalization_obligation", "source_anchor": "", "notes": "Selecting Rust 1.85.1 as StatQED's compatibility-only floor is downstream policy supported by the retained dev/MSRV differential; it is not an upstream support claim."},
    {"name": "rust_version_is_support_floor", "class": "source_explicit", "source_anchor": "https://doc.rust-lang.org/stable/cargo/reference/rust-version.html", "notes": "package.rust-version declares the supported Rust version; Cargo respects it since 1.56, but --ignore-rust-version bypasses the check."},
    {"name": "cargo_cve_2026_5222", "class": "source_explicit", "source_anchor": "https://blog.rust-lang.org/2026/05/25/cve-2026-5222/", "notes": "The official advisory rates the sparse-registry credential issue low severity, affects Cargo shipped with Rust 1.68 through versions before 1.96, states no mitigation for older Cargo, and says crates.io users are not affected."},
    {"name": "cargo_cve_2026_5223", "class": "source_explicit", "source_anchor": "https://blog.rust-lang.org/2026/05/25/cve-2026-5223/", "notes": "The official advisory rates malicious third-party-registry tarball symlink extraction medium severity, affects Cargo shipped before Rust 1.96.0, and recommends upgrading or auditing/rejecting symlinks where upgrade is unavailable; crates.io forbids such uploads."},
    {"name": "rust_1_96_1_libssh2_security_fixes", "class": "source_explicit", "source_anchor": "https://blog.rust-lang.org/2026/06/30/Rust-1.96.1/", "notes": "The official point-release post states Cargo's bundled libssh2 was patched for CVE-2025-15661, CVE-2026-55199, and CVE-2026-55200."},
    {"name": "msrv_cargo_is_secure_bootstrap", "class": "strengthening_unjustified", "source_anchor": "https://blog.rust-lang.org/2026/05/25/cve-2026-5223/", "notes": "A passing build at Rust/Cargo 1.85.1 establishes compatibility only. Its bundled Cargo is within the affected ranges of both official 2026 Cargo advisories, and Rust upstream does not backport fixes to old toolchains."},
    {"name": "rust_upstream_supports_old_compilers", "class": "strengthening_unjustified", "source_anchor": "https://doc.rust-lang.org/stable/cargo/reference/rust-version.html#support-expectations", "notes": "Official Cargo docs say Rust itself provides bug and security fixes only for the latest release; N-2 and similar MSRV policies are examples for downstream projects, not upstream guarantees."},
    {"name": "rustup_1_29_release_and_license", "class": "source_explicit", "source_anchor": "https://raw.githubusercontent.com/rust-lang/rustup/1.29.0/Cargo.toml", "notes": "The immutable manifest declares rustup 1.29.0 and license MIT OR Apache-2.0; the signed official tag exposes short commit 28d1352 and is dated 2026-03-12."},
    {"name": "supported_targets_build_this_workspace", "class": "formalization_obligation", "source_anchor": "https://forge.rust-lang.org/release/platform-support.html", "notes": "Target tiers describe Rust distribution guarantees; they do not prove this workspace or its native dependencies build there."}
