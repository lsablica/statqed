    {"name": "python_original_tested_pin", "class": "source_explicit", "source_anchor": "https://www.python.org/downloads/release/python-3146/", "notes": "Python 3.14.6 was released 2026-06-10. Its official page now explicitly says it has been superseded by Python 3.14.7; the immutable tested tag is c63aec69bd59c55314c06c23f4c22c03de76fe45."},
    {"name": "python_current_stable_refresh", "class": "source_explicit", "source_anchor": "https://www.python.org/downloads/release/python-3147/", "notes": "Python 3.14.7 was released 2026-08-05. The official source page publishes SHA-256 3b48dac8fb59f62eaa67ac83c1eb12bda1b7a08406dd286e252c11a66be27f81 for the XZ source tarball."},
    {"name": "python_build_standalone_20260805_runtime", "class": "source_explicit", "source_anchor": "https://api.github.com/repos/astral-sh/python-build-standalone/releases/tags/20260805", "notes": "The official release API identifies tag 20260805 at target commit 76b41240bc8dfe753a54b2e32c8941e536568be8 and the exact x86_64-unknown-linux-gnu CPython 3.14.7 install-only stripped asset with SHA-256 a3a4e4b81b138960c7c546694df8a77578c0b6aa46d47e96f49b9e10e8f860c9 and size 35,931,360 bytes. The tagged project license is MPL-2.0; redistribution of the produced runtime must also preserve CPython and bundled-component notices."},
    {"name": "managed_runtime_executes_statqed_probe", "class": "formalization_obligation", "source_anchor": "", "notes": "A release record and asset digest establish provenance, not runtime compatibility. The matrix and retained probe logs must state the actual command, platform, result, and digest verification."},
    {"name": "scheduled_release_is_available_at_original_cutoff", "class": "strengthening_unjustified", "source_anchor": "https://peps.python.org/pep-0745/#schedule", "notes": "At the August 3 cutoff, PEP 745 was a schedule rather than a release artifact. The August 5 release resolves currentness prospectively but does not rewrite the original probe chronology."},
    {"name": "python_floor_release", "class": "source_explicit", "source_anchor": "https://www.python.org/downloads/release/python-31115/", "notes": "CPython 3.11.15 was released 2026-03-03 as a source-only security release. The signed Git tag resolves to 2340a037f7450e70fccfe411e6531afb4d57a312; the official XZ source SHA-256 is 272179ddd9a2e41a0fc8e42e33dfbdca0b3711aa5abf372d3f2d51543d09b625."},
    {"name": "python_3_11_is_project_support_floor", "class": "formalization_obligation", "source_anchor": "", "notes": "Choosing 3.11 as StatQED's minimum is downstream policy, not a CPython promise. It requires package build/install/test evidence and periodic security review."},
    {"name": "python_support_phases", "class": "source_explicit", "source_anchor": "https://devguide.python.org/versions/#supported-versions", "notes": "3.11 is in security-fixes-only status. The 3.11.15 release page states releases are irregular and source-only until October 2027; regular binary installers are no longer provided."},
