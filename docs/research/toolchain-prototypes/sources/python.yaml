  "controlled_statement": "CPython 3.14.6 was the exact development runtime tested at the original 2026-08-03 cutoff. The official Python release page now marks 3.14.6 superseded by 3.14.7, released 2026-08-05. The Astral 20260805 release supplies an exact x86-64 GNU/Linux CPython 3.14.7 runtime asset, but its source identity and digest do not establish a successful StatQED probe; execution evidence is recorded separately. CPython 3.11.15 is the exact source-only security release used to exercise the proposed Python 3.11 package-support floor. pyproject.toml and requires-python declare build and interpreter constraints, while actual supported combinations require tests.",
