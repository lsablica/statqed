  "controlled_statement": "R 4.6.1 was the current development/reference release observed on 2026-08-03. R 4.4.3 is an exact archived R Core release used to exercise the project-proposed 4.4 support floor; selecting that floor is StatQED policy rather than an R Core support promise. testthat 3.3.2 is the exact MIT-licensed CRAN source used with the development probe, while archived testthat 3.2.3 is the exact package version used with the floor candidate through a separately hash-locked conda artifact. R package support must be expressed in DESCRIPTION and tested with R CMD check on explicit hosts; release cadence and CRAN acceptance policy do not define a multi-version support guarantee.",
