[workspace]
members = ["crates/compat-probe"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85.1"
version = "0.0.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.dependencies]
arrow = { version = "=59.1.0", default-features = false, features = ["ipc"] }
blake3 = "=1.8.5"
clap = { version = "=4.6.5", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
zip = { version = "=7.2.0", default-features = false }
