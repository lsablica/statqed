audit_id: SA-SQ0006-CDDL
subject: Published CDDL basis and exact six-field foundation structural schema boundary
source:
  work: RFC 8610, Concise Data Definition Language (CDDL)
  version: RFC 8610, June 2019, as updated by RFC 9682, November 2024
  locator: https://www.rfc-editor.org/rfc/rfc8610.html, Sections 2.1, 2.2.3-2.2.4, 3.1-3.5, 4.2, and 5; current grammar at RFC 9682 Appendix A
  persistent_id: https://doi.org/10.17487/RFC8610
controlled_statement: >-
  A standalone CDDL root map containing exactly the six explicitly named
  SQ-0006 entries, with no occurrence markers and no wildcard entry, requires
  those entries and leaves an unknown entry uncovered. Literal values constrain
  four fields, and [] constrains features to an empty array. analysis_id: tstr
  constrains only the data-model type; the StatQED ASCII grammar and byte-length
  bound remain semantic-validation obligations. CDDL does not establish
  deterministic CBOR bytes, map order, duplicate-key policy, provenance,
  digest validity, statistical validity, or artifact validity.
retrieved_at: '2026-08-10'
