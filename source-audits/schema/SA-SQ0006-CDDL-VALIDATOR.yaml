hypotheses:
  - name: selected_version_identity
    class: source_explicit
    source_anchor: crates.io sparse-index cddl 0.10.6 record and packaged .cargo_vcs_info.json
    notes: Exact archive checksum, publication state, source commit, and packaged lockfile are recorded above.
  - name: declared_minimum_supported_rust_version
    class: source_explicit
    source_anchor: cddl 0.10.6 Cargo.toml.orig rust-version and README lines 7-20
    notes: The declared minimum supported Rust version is 1.88.0.
  - name: cli_compile_and_explicit_cbor_paths
    class: source_explicit
    source_anchor: cddl 0.10.6 src/bin/cli.rs lines 38-96 and 121-248
    notes: compile-cddl parses a schema; validate with --cbor reads a CBOR file and calls CBOR validation.
  - name: ci_mode_changes_missing_file_behavior
    class: source_explicit
    source_anchor: cddl 0.10.6 src/bin/cli.rs lines 27-35 and 121-132
    notes: --ci makes a missing schema file fail instead of entering interactive behavior.
  - name: default_features_include_extensions_and_drafts
    class: source_explicit
    source_anchor: cddl 0.10.6 Cargo.toml.orig features; README lines 7-20 and 166-204
    notes: Defaults include additional-controls and freezer, while the CLI requires csv-validate; README identifies freezer-17 and CSV-08 as drafts.
  - name: maintenance_badge_is_self_reported
    class: source_implicit_justified
    source_anchor: cddl 0.10.6 Cargo.toml.orig badges.maintenance status actively-developed
    notes: Record it as project metadata, not as an availability, response-time, or future-maintenance guarantee.
  - name: exact_locked_install
    class: formalization_obligation
    source_anchor: crates.io cddl 0.10.6 record and packaged Cargo.lock
    notes: Use cargo install cddl --version 0.10.6 --locked and verify the archive checksum in a controlled acquisition workflow.
  - name: isolated_rust_toolchain
    class: formalization_obligation
    source_anchor: cddl declared Rust 1.88.0; SQ-0002 toolchain evidence; StatQED Rust 1.85.1 support floor
    notes: The validator cannot be built under the project support floor; run it in a separately pinned dev/CI toolchain.
  - name: explicit_noninteractive_invocation
    class: strengthening_justified
    source_anchor: cddl 0.10.6 src/bin/cli.rs lines 27-96 and 121-248
    notes: Use --ci and explicit --cddl/--cbor paths to avoid interactive behavior and stdin's UTF-8-based JSON/CBOR auto-detection.
  - name: validator_defines_normative_grammar
    class: strengthening_unjustified
    source_anchor: RFC 8610 as updated by RFC 9682; cddl README lines 7-20
    notes: The RFCs and reviewed schema define the language; implementation acceptance does not promote extension or draft syntax.
  - name: build_under_rust_1_85_1
    class: strengthening_unjustified
    source_anchor: cddl 0.10.6 rust-version 1.88.0 and SQ-0002 failed-floor evidence
    notes: Raising or misreporting compatibility to simplify integration is not supported; isolate the tool instead.
  - name: cddl_acceptance_establishes_all_fixture_semantics
    class: strengthening_unjustified
    source_anchor: RFC 8610 Sections 2.2.3, 3.5.3, and 4.2; SQ-0006 contract
    notes: It establishes only cddl_shape and cannot replace deterministic-profile or semantic stages.
  - name: enabled_draft_features_authorize_draft_schema_syntax
    class: strengthening_unjustified
    source_anchor: cddl README lines 7-20 and 166-204; draft status boilerplate
    notes: A build feature is an implementation capability, not a standards decision.
  - name: direct_osv_empty_result_is_security_clearance
    class: strengthening_unjustified
    source_anchor: OSV querybatch response index four, 2026-08-10
    notes: The result is point-in-time and direct-package only; it neither scans the 154-package install graph nor proves absence of vulnerabilities.
  - name: retained_transitive_advisory_scan
    class: retained_point_in_time_observation
    source_anchor: SQ-0006 security review requirement
    notes: cargo-audit 0.22.2 against RustSec commit 309ad29d8fe448bf986019e05d47b9e0e29a2218 and the exact 154-package lock reported zero vulnerabilities and warnings across 1,197 loaded advisories; executable, archives, lock, result, and limitations are hash-bound in cddl-advisory-observation.json and this remains a point-in-time observation rather than a security guarantee.
  - name: linux_x86_64_result_generalizes_to_all_platforms
    class: strengthening_unjustified
    source_anchor: SQ-0002 Ubuntu 24.04 x86_64 prototype evidence
    notes: Current execution evidence is platform-specific; add supported-platform runs before making a broader claim.
  - name: randomness_assumption
    class: not_applicable
    source_anchor: Deterministic schema compiler and validator invocation
    notes: No stochastic algorithm is part of this tool selection claim.
variants:
  - name: Exact default-feature installation
    locator: cddl 0.10.6 Cargo.toml.orig default features
    conflict: It builds the supported CLI but includes parsers and controls beyond the SQ-0006 normative syntax.
    disposition: Candidate operational build; enforce a published-syntax schema allowlist and never infer normativity from feature availability.
  - name: Reduced features without ast-span
    locator: Local offline feature-ablation run, 2026-08-10
    conflict: std,json,cbor,csv-validate alone failed with 18 compile errors; adding additional-controls failed with 10; adding freezer still failed with 10.
    disposition: Rejected as non-building for cddl 0.10.6.
  - name: Reduced features with ast-span, additional-controls, and freezer
    locator: Local offline feature-ablation run, 2026-08-10
    conflict: std,json,cbor,csv-validate,additional-controls,freezer,ast-span built successfully but still compiles draft CSV/freezer support and is not materially draft-free.
    disposition: Not selected as a normative distinction; exact default installation has the clearer published lockfile evidence.
  - name: Rust 1.85.1 project support floor
    locator: SQ-0002 retained failure evidence
    conflict: Below cddl 0.10.6's declared Rust 1.88.0 minimum and fails dependency selection.
    disposition: Do not build cddl in the support-floor job.
  - name: Rust 1.97.1 Ubuntu prototype
    locator: SQ-0002 retained success evidence
    conflict: Demonstrates one successful environment, not all Rust versions at or above the declared minimum.
    disposition: Accepted prototype witness; pin the actual CI toolchain independently.
  - name: stdin validation
    locator: cddl 0.10.6 src/bin/cli.rs validate implementation
    conflict: Valid UTF-8 input can be auto-selected as JSON rather than CBOR.
    disposition: Reject for normative CBOR tests; use an explicit --cbor file.
  - name: direct OSV package query
    locator: OSV API result, 2026-08-10
    conflict: Does not cover the transitive installation graph.
    disposition: Retain as limited currentness evidence, not as a substitute for a RustSec graph scan.
concept_mapping:
  - source_concept: compile-cddl
    statqed_concept: schema source syntax check
    obligation: Fail noninteractively and preserve the exact source and tool versions.
  - source_concept: validate --cbor
    statqed_concept: untrusted cddl_shape producer
    obligation: Run only after raw-profile validation and before independent semantic validation.
  - source_concept: Cargo rust-version
    statqed_concept: dev/CI toolchain lower bound
    obligation: Do not silently raise StatQED's public Rust support floor.
  - source_concept: Cargo feature support
    statqed_concept: implementation attack surface
    obligation: A schema-source allowlist, not compiled feature presence, controls normative syntax.
quantifiers:
  - statement: Every normative validation run uses cddl 0.10.6 from the recorded archive lineage and explicit noninteractive file arguments.
    source_status: Project reproducibility obligation; not guaranteed by Cargo without pinning and acquisition checks.
  - statement: Every cddl success is reported only as cddl_shape and is composed with independent earlier and later checks.
    source_status: Project trust obligation grounded in RFC 8610 scope.
randomness_scopes: []
nonvacuity_witnesses:
  - name: compiler_success
    value: cddl --ci compile-cddl --cddl schemas/v0/compiled/foundation-structural.cddl
    purpose: Shows that the selected executable can parse the reviewed schema source.
  - name: explicit_cbor_validation
    value: cddl --ci validate --cddl schemas/v0/compiled/foundation-structural.cddl --cbor VALID_FIXTURE
    purpose: Exercises the CBOR path without stdin auto-detection.
  - name: toolchain_floor_failure
    value: cddl 0.10.6 installation under Rust 1.85.1 exits 101 because the package and selected dependencies require Rust 1.88.0.
    purpose: Refutes integration into the public support-floor build.
  - name: draft_feature_non_authority
    value: A schema containing a freezer-only control may be parsed by the executable.
    purpose: It must still fail StatQED's normative source-policy review because tool capability is not standards authority.
strengthenings:
  - name: exact_version_locked_install
    class: strengthening_justified
    reason: Fixes source and dependency resolution for a reproducible untrusted tool.
    approval_required: toolchain and security review
  - name: ci_and_explicit_files
    class: strengthening_justified
    reason: Makes failure behavior and CBOR input selection unambiguous.
    approval_required: conformance review
  - name: published_syntax_allowlist
    class: strengthening_justified
    reason: The executable includes active-draft support that the normative schema is not authorized to use.
    approval_required: schema review
weakenings:
  - name: broader_platform_claim
    class: candidate_for_weakening
    reason: Add exact tested environments rather than extrapolating from the retained Ubuntu x86_64 prototype.
    approval_required: toolchain review with retained evidence
