audit_id: SA-SQ0006-CDDL-VALIDATOR
subject: cddl 0.10.6 provenance, license, toolchain, feature surface, and advisory evidence
source:
  work: anweiss/cddl
  version: crates.io cddl 0.10.6; source commit a42a702cf977179236523e5559c81e7bbd5dfa7e
  locator: https://github.com/anweiss/cddl/tree/a42a702cf977179236523e5559c81e7bbd5dfa7e
  persistent_id: https://crates.io/crates/cddl/0.10.6
controlled_statement: >-
  cddl 0.10.6 is a candidate untrusted development and CI validator for
  compiling the SQ-0006 standalone schema and checking explicit CBOR files.
  The package declares Rust 1.88.0 as its minimum supported Rust version and
  ships a lockfile. It must be installed at the exact version with --locked,
  isolated from StatQED's Rust 1.85.1 support-floor build, and invoked with
  --ci and an explicit --cbor file. Its default executable includes support
  for published extensions and active drafts; that support does not authorize
  those syntaxes in a normative schema. Tool success establishes only the
  cddl_shape stage.
