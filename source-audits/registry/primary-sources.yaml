cryptography:
  - title: FIPS 180-4 Secure Hash Standard
    version: August 2015, Update 1
    persistent_id: https://doi.org/10.6028/NIST.FIPS.180-4
    sections: ["4.1.2", "4.2.2", "5.1.1", "5.2.1", "5.3.3", "6.2"]
    license: United States government standard
    consequence: exact SHA-256 function and 32-octet output only; no semantic equality, authorization, provenance, or collision-freedom claim
  - title: RFC 9162 Certificate Transparency Version 2.0
    version: December 2021, Experimental
    persistent_id: https://doi.org/10.17487/RFC9162
    sections: ["2.1.1"]
    license: IETF Trust Legal Provisions
    consequence: nearby domain-tag evidence only; StatQED keeps its accepted typed length framing
