lean:
  release: v4.32.2
  commit: f3b06c705e6c85f5314019d5d3baab0fec5b580c
  license: Apache-2.0
  repository: https://github.com/leanprover/lean4/commit/f3b06c705e6c85f5314019d5d3baab0fec5b580c
  sources:
    - path: src/Lean/Expr.lean
      anchors: ["18-23 Literal", "46-80 BinderInfo", "290-469 Expr", "787-820 equal/eqv", "1077-1083 metadata"]
      consequence: cover or reject every constructor; neither pretty printing nor cached hashes are canonical bytes
    - path: src/Lean/Level.lean
      anchors: ["89-107 constructors", "379-408 normalize/isEquiv"]
      consequence: isEquiv is explicitly incomplete; v0 preserves the raw versioned level tree and makes no completeness claim
    - path: src/Lean/Declaration.lean
      anchors: ["16-45 reducibility", "94-193 records", "428-514 ConstantInfo"]
      consequence: closure payloads are selected by declaration kind; proof bodies remain separate
    - path: src/Lean/Environment.lean
      anchors: ["32-79 checking", "107-176 header", "1835-1858 module serialization", "2243-2388 imports/trust"]
      consequence: olean and the whole import DAG are build inputs, not stable language-neutral semantic bytes
    - path: src/Lean/Util/CollectAxioms.lean
      anchors: ["29-74 recursive collector and missing constants", "86-154 imported extension/public API"]
      consequence: require declaration presence before collection and independently traverse closure; the result is an observation
    - path: src/Lean/Replay.lean
      anchors: ["13-27 purpose", "74-140 replay", "176-189 skipped unsafe/partial"]
      consequence: fresh replay is same-kernel corruption evidence and skipped categories must be rejected separately
    - path: src/LeanChecker.lean
      anchors: ["12-38 modes", "56-69 external-verifier disclaimer"]
      consequence: never call leanchecker an independent or external verifier
  ambiguities_resolved_for_v0:
    expression_identity: conservative structural protocol after metadata/binder-name/nondep erasure; no claim of complete definitional equality
    binder_info: retained as a reviewed public-interface identity lock even though the kernel ignores it
    universe_identity: versioned raw constructor tree; Level.isEquiv is not used or described as complete
    unfolding: none
    literal_projection: constructor tags retained
    closure: kind-specific transitive payload, inductive families atomic, missing names fail closed
    axiom_policy: empty allowed imported set for the test-only record
