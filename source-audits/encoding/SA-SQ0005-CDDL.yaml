audit_id: SA-SQ0005-CDDL
subject: CDDL grammar, optional controls, errata, and module/import currentness
source:
  work: RFC 8610, Concise Data Definition Language (CDDL)
  version: RFC 8610; June 2019; as updated by RFC 9682, November 2024
  locator: https://www.rfc-editor.org/rfc/rfc8610.html, Sections 1-4 and Appendices B and G; updated grammar at RFC 9682 Appendix A
  persistent_id: https://doi.org/10.17487/RFC8610
controlled_statement: >-
  CDDL specifies sets of acceptable CBOR or JSON data items and their
  structure.  It does not specify CBOR serialization bytes, deterministic map
  order, Unicode normalization, digest framing, or StatQED semantic validity.
  The current published grammar is RFC 8610 as updated by RFC 9682.  RFCs 9165
  and 9741 register optional control operators but are not needed by the
  minimum SQ-0005 schema.  CDDL module/import directives remain Work in
  Progress in draft-ietf-cbor-cddl-modules-06 and therefore cannot appear in a
  normative schema; an experiment may pin that exact draft and remain
  Experimental.
retrieved_at: '2026-08-09'
