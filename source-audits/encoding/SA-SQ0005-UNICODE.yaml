audit_id: SA-SQ0005-UNICODE
subject: UTF-8 validity and Unicode normalization disposition for deterministic artifacts
source:
  work: RFC 3629, UTF-8, a transformation format of ISO 10646
  version: RFC 3629; November 2003; Unicode Standard 17.0.0 and UAX 15 Revision 57 used for current normalization context
  locator: https://www.rfc-editor.org/rfc/rfc3629.html, Sections 3, 4, and 10
  persistent_id: https://doi.org/10.17487/RFC3629
controlled_statement: >-
  CBOR text strings contain UTF-8, and invalid UTF-8 is invalid CBOR.  RFC 3629
  restricts UTF-8 to Unicode scalar values through U+10FFFF, excluding surrogate
  code points and overlong or otherwise malformed sequences.  Neither RFC 3629
  nor RFC 8949 requires Unicode normalization.  Unicode 17.0.0 and UAX 15
  Revision 57 define NFC, NFD, NFKC, and NFKD, but compatibility normalization
  can erase semantic distinctions.  The recommended SQ-0005 baseline therefore
  preserves the decoded scalar sequence exactly and performs no normalization;
  any future normalization profile must pin an exact Unicode version and define
  collision, unassigned-code-point, and error behavior.
