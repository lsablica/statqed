hypotheses:
  - name: cbor2_canonical_is_length_first
    class: source_explicit
    source_anchor: cbor2 6.1.4 API, CBOREncoder.encode_sortable_key
    notes: The sorting key is encoded length followed by encoding, corresponding to RFC 8949 Section 4.2.3 rather than core Section 4.2.1.
  - name: cbor2_decode_defaults_are_strict_profile_defaults
    class: strengthening_unjustified
    source_anchor: cbor2 6.1.4 API, cbor2.loads
    notes: Defaults accept indefinite items and duplicate keys; the prototype must set explicit strict flags and still validate all profile rules independently.
  - name: cbor2_is_independent_python_implementation
    class: strengthening_unjustified
    source_anchor: cbor2 6.1.4 PyPI project description
    notes: The package API is Python but the implementation is Rust; independence claims must use implementation lineage, not frontend language.
  - name: ciborium_canonical_is_length_first
    class: source_explicit
    source_anchor: ciborium 0.2.2 value/canonical.rs lines 8-60
    notes: It compares encoded length and then bytes, explicitly implementing RFC 8949 Section 4.2.3.
  - name: minicbor_supplies_profile_ordering
    class: source_implicit_justified
    source_anchor: minicbor 2.3.0 encoder and token APIs
    notes: Low-level output follows caller order; no source evidence establishes a built-in map sorter for the proposed profile.
  - name: cddl_default_features_are_normative_cddl
    class: strengthening_unjustified
    source_anchor: cddl 0.10.6 feature metadata; RFC 8610 as updated by RFC 9682
    notes: Tool support for optional or draft controls does not elevate them into the normative schema language.
  - name: cddl_0106_matches_project_rust_floor
    class: strengthening_unjustified
    source_anchor: cddl 0.10.6 rust_version 1.88.0 and project Rust floor 1.85.1
    notes: The tool cannot be assumed to compile under the project floor; isolate it as a dev tool or choose a separately audited compatible version.
  - name: exact_version_and_flags
    class: formalization_obligation
    source_anchor: Official package metadata and versioned APIs
    notes: Every differential result must record version, flags, input bytes, exit status, output bytes, and environment.
  - name: independent_oracle_lineage
    class: formalization_obligation
    source_anchor: cbor2 implementation metadata and Rust crate metadata
    notes: At least one oracle must be independent in algorithm/code lineage, not merely a second wrapper around the same implementation family.
  - name: empty_osv_result_means_secure
    class: strengthening_unjustified
    source_anchor: OSV querybatch API semantics
    notes: Absence of returned records is time- and database-relative and says nothing about undisclosed issues or unqueried transitive versions.
  - name: top_level_license_closes_dependency_licenses
    class: strengthening_unjustified
    source_anchor: Publisher metadata license fields
    notes: Each resolved transitive package and bundled code component needs separate license inventory before release.
  - name: prototype_is_untrusted
    class: source_implicit_justified
    source_anchor: StatQED trust model and library security/currentness records
    notes: Package output is evidence for tests, never the normative definition or kernel proof.
variants:
  - name: cbor2 6.1.4 canonical mode
    locator: cbor2 API and version history
    conflict: Convenient and actively fixed, but length-first ordering and permissive decoder defaults conflict with a strict core profile; implementation is Rust.
    disposition: Candidate adversarial decoder/length-first oracle only with explicit flags; not an independent Python code lineage.
  - name: ciborium 0.2.2 CanonicalValue
    locator: value/canonical.rs lines 8-60
    conflict: Explicit length-first algorithm.
    disposition: Useful oracle for the excluded length-first variant and map-storage tests; not the core-profile normative encoder.
  - name: minicbor 2.3.0 low-level encoder
    locator: versioned encoder API
    conflict: Caller controls order, so the prototype itself must implement every profile rule.
    disposition: Candidate independent manual implementation within Rust, with differential and mutation tests.
  - name: cddl 0.10.6
    locator: versioned crate metadata and docs.rs features
    conflict: Rust 1.88.0 requirement exceeds project floor and defaults include syntax beyond the minimum published subset.
    disposition: Isolated dev-tool candidate only; disable unnecessary features and test exact schemas, or select another audited tool version.
  - name: serde_cbor
    locator: official repository archive status
    conflict: Archived/unmaintained.
    disposition: Excluded.
concept_mapping:
  - source_concept: library canonical mode
    statqed_concept: named test oracle for one exact ordering variant
    obligation: Never infer profile identity from the word canonical.
  - source_concept: decoder success
    statqed_concept: one untrusted parse observation
    obligation: Compare against a strict raw-byte validator and preserved map-entry stream.
  - source_concept: package license field
    statqed_concept: top-level redistribution input
    obligation: Generate a resolved transitive license inventory before release.
  - source_concept: advisory query result
    statqed_concept: dated external security observation
    obligation: Repeat against the resolved lockfile and retain exact query evidence at the release gate.
quantifiers:
  - statement: Every golden and corrupted corpus item is run through every pinned oracle with explicit configuration.
    source_status: Project conformance obligation.
  - statement: Agreement of all prototype libraries implies correctness.
    source_status: False; shared misinterpretation and shared implementation lineage remain possible.
randomness_scopes: []
nonvacuity_witnesses:
  - name: ordering_disagreement_corpus
    value: Map keys selected so RFC 8949 core and length-first order disagree.
    purpose: Prevents all canonical flags from appearing to agree on an uninformative corpus.
  - name: permissive_default_corpus
    value: Duplicate-key and indefinite-length CBOR items.
    purpose: Confirms that explicit strict configuration and raw validation are necessary.
  - name: cbor2_regression_corpus
    value: Incomplete indefinite map and tag 2/3 with a non-byte-string payload.
    purpose: Pins fixes called out in cbor2 6.1.4 and guards historical weak acceptance.
strengthenings:
  - name: exact_tool_pinning
    class: strengthening_justified
    reason: Software behavior and security fixes change across versions.
    approval_required: conformance review
  - name: explicit_flags_and_raw_vectors
    class: strengthening_justified
    reason: Defaults differ from the proposed strict profile and can erase errors.
    approval_required: checker and conformance review
weakenings:
  - name: prototype_only_status
    class: candidate_for_weakening
    effect: Allows useful differential evidence without claiming the tools are normative or trusted.
    disposition: Required trust-language boundary.
attribution:
  - kind: software_semantics
    work: Exact publisher metadata and versioned documentation
    detail: Behavior claims are restricted to the exact package versions and cited API/source anchors.
  - kind: security_observation
    work: OSV querybatch
    detail: Four empty direct-version results are recorded only as a dated no-record observation.
  - kind: excluded
    work: serde_cbor
    detail: Archived status is an explicit exclusion rather than an undocumented omission.
  - kind: original
    work: StatQED prototype harness
    detail: Corpus design, profile implementation, lineage independence, and release qualification remain project obligations.
review:
  status: DRAFT
  reviewers: []
  statement_hash: ''
