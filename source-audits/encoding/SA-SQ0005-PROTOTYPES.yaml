audit_id: SA-SQ0005-PROTOTYPES
subject: Versioned CBOR and CDDL prototype library semantics, licenses, and advisory evidence
source:
  work: Official publisher metadata and versioned documentation for cbor2 6.1.4, ciborium 0.2.2, minicbor 2.3.0, and cddl 0.10.6
  version: Exact versions current or selected on 2026-08-09
  locator: https://pypi.org/pypi/cbor2/6.1.4/json; https://crates.io/api/v1/crates/ciborium/0.2.2; https://crates.io/api/v1/crates/minicbor/2.3.0; https://crates.io/api/v1/crates/cddl/0.10.6
  persistent_id: Exact package names and immutable published versions in PyPI and crates.io
controlled_statement: >-
  These packages are untrusted prototype producers and differential oracles,
  not normative definitions or members of the trusted computing base.  Their
  default and so-called canonical behaviors do not necessarily match a chosen
  StatQED profile.  Exact versions, flags, input paths, output bytes, and
  implementation lineage must be captured.  Top-level publisher licenses are
  source inputs; the selected Rust prototype's exact transitive graph is
  separately bound to Cargo.lock and a dated RustSec observation.  Neither is
  legal advice or a security guarantee.
retrieved_at: '2026-08-09'
source_records:
  - work: cbor2
    version: 6.1.4; released 2026-08-01T20:40:24Z; Python at least 3.10; not yanked
    locator: https://pypi.org/pypi/cbor2/6.1.4/json; https://cbor2.readthedocs.io/en/latest/api.html; https://cbor2.readthedocs.io/en/latest/versionhistory.html
    persistent_id: PyPI cbor2==6.1.4
    status: Current PyPI release at retrieval; implemented in Rust; documentation says it has not been tested against malicious input
    exact_anchors:
