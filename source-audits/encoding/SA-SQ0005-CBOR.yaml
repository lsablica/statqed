audit_id: SA-SQ0005-CBOR
subject: CBOR deterministic encoding, validity, semantic tags, and registry currentness
source:
  work: RFC 8949, Concise Binary Object Representation (CBOR)
  version: STD 94; RFC 8949; December 2020; with verified Erratum ID 8589
  locator: https://www.rfc-editor.org/rfc/rfc8949.html, Sections 1.2, 3.2-3.4, 4.1-4.2.3, 5.2-5.6.1, 9, and 10
  persistent_id: https://doi.org/10.17487/RFC8949
controlled_statement: >-
  RFC 8949 defines CBOR well-formedness, validity, preferred serialization,
  and more than one deterministic encoding profile.  Its core deterministic
  encoding (Section 4.2.1) uses preferred serialization, forbids
  indefinite-length items, and orders map keys lexicographically by their
  deterministic encodings.  The distinct length-first profile in Section
  4.2.3 orders shorter encoded keys first.  A StatQED profile must select one
  profile and also decide every application-dependent option in Section
  4.2.2, tag semantics, duplicate-key handling, resource limits, and any
  numeric semantic normal forms.  Neither RFC 8949 nor IANA registration by
  itself supplies a unique rational, interval, or application semantic model.
retrieved_at: '2026-08-09'
