hypotheses:
  - name: one_complete_data_item
    class: source_explicit
    source_anchor: RFC 8949 Sections 1.2 and 3
    notes: A CBOR data item is parsed under the major-type and additional-information rules; trailing bytes are a separate framing concern.
  - name: preferred_integer_length_and_tag_arguments
    class: source_explicit
    source_anchor: RFC 8949 Sections 4.1 and 4.2.1
    notes: Integers, lengths, and tag arguments use the shortest permitted form in preferred serialization.
  - name: no_indefinite_lengths
    class: source_explicit
    source_anchor: RFC 8949 Section 4.2.1
    notes: Both RFC 8949 deterministic profiles exclude indefinite-length encodings.
  - name: core_map_key_order
    class: source_explicit
    source_anchor: RFC 8949 Section 4.2.1
    notes: Core deterministic encoding compares deterministic key encodings bytewise in lexical order.
  - name: length_first_map_key_order
    class: source_explicit
    source_anchor: RFC 8949 Section 4.2.3
    notes: The alternative profile compares encoded length before lexical bytes; it conflicts with core ordering for some maps.
  - name: float_shortest_round_trip_form
    class: source_explicit
    source_anchor: RFC 8949 Sections 4.1 and 4.2.1
    notes: If floating-point values are admitted, preferred serialization chooses the shortest width preserving the value; NaN has an additional preferred form.
  - name: application_options_are_explicit
    class: source_explicit
    source_anchor: RFC 8949 Section 4.2.2
    notes: Tag presence, bignum boundary, negative zero, NaN, and alternative numeric forms require protocol decisions.
  - name: duplicate_map_keys_are_invalid
    class: source_explicit
    source_anchor: RFC 8949 Sections 5.3.1 and 5.6
    notes: Duplicate encoded or application-equivalent map keys are a validity concern and cannot be detected after lossy map construction in general.
  - name: invalid_utf8_is_invalid_cbor
    class: source_explicit
    source_anchor: RFC 8949 Section 5.3.1
    notes: A text string containing invalid UTF-8 is invalid CBOR.
  - name: nan_key_equivalence_sign_bit
    class: source_explicit
    source_anchor: RFC 8949 Section 5.6.1 as corrected by verified EID 8589
    notes: NaN keys are equivalent only when their encoding width, payload, and sign bit agree.
  - name: tags_are_not_self_validating
    class: source_explicit
    source_anchor: RFC 8949 Sections 3.4 and 5.3.2
    notes: Tag validity depends on the tag specification and the tagged item; unknown tags can remain uninterpreted in generic decoding.
  - name: tag_30_is_not_a_unique_rational_normal_form
    class: source_explicit
    source_anchor: CBOR tag 30 specification, Detailed Semantics
    notes: The numerator and nonzero denominator need not be in lowest terms, so equal rational values can have distinct valid tag-30 encodings.
  - name: no_registered_interval_tag
    class: source_implicit_justified
    source_anchor: IANA CBOR Tags registry snapshot last updated 2026-07-20
    notes: Exhaustive registry inspection found no tag whose registered semantics is a mathematical interval; absence is snapshot-relative and must be rechecked if the registry changes.
  - name: exact_semantic_normal_form
    class: formalization_obligation
    source_anchor: RFC 8949 Sections 3.4.3-3.4.4, 4.2.2, and 5.5; tag 30 Detailed Semantics
    notes: StatQED must define value-level invariants for every admitted exact numeric form and prove or test unique representability; the standards do not provide the needed theorem.
  - name: raw_map_entry_validation
    class: formalization_obligation
    source_anchor: RFC 8949 Sections 5.3.1 and 5.6
    notes: Validation must observe every encoded key before conversion to a host map so duplicate or equivalent keys cannot be erased.
  - name: strict_rejection_of_non_profile_bytes
    class: strengthening_justified
    source_anchor: RFC 8949 Sections 5.3 and 5.4; SQ-0005 deterministic-byte and digest requirements
    notes: RFC 8949 permits other decoder policies, but a content-addressed profile should reject rather than silently normalize non-profile encodings. This requires architecture and independent review.
  - name: core_order_selected_for_new_profile
    class: strengthening_justified
    source_anchor: RFC 8949 Sections 4.2.1 and 4.2.3
    notes: Recommended because SQ-0005 has no RFC 7049 compatibility requirement; selecting length-first merely because prototype libraries implement it would be an unjustified implementation-driven strengthening.
  - name: all_unlisted_tags_rejected
    class: strengthening_justified
    source_anchor: RFC 8949 Sections 3.4, 4.2.2, and 5.3.2
    notes: Recommended for the first closed profile to prevent unknown semantics from changing bytes or interpretation; any extension mechanism must be separately versioned.
  - name: forbid_tag_55799
    class: strengthening_justified
    source_anchor: RFC 8949 Section 3.4.6
    notes: The self-described-CBOR tag adds no application semantics and optional use would create two byte encodings for the same artifact.
  - name: accept_any_library_canonical_mode
    class: strengthening_unjustified
    source_anchor: RFC 8949 Sections 4.2.1 and 4.2.3
    notes: Libraries commonly label the incompatible length-first variant canonical; the profile cannot inherit an undocumented library choice.
  - name: infer_semantic_validity_from_deterministic_bytes
    class: strengthening_unjustified
    source_anchor: RFC 8949 Sections 4.2 and 5.3
    notes: Deterministic serialization and CBOR validity do not establish StatQED schema or scientific semantics.
  - name: reject_all_unicode_noncharacters_or_controls
    class: strengthening_unjustified
    source_anchor: RFC 8949 Sections 3.1 and 5.3.1
    notes: Such code points can be valid UTF-8/CBOR text; a rejection requires an application-semantic source, not implementation convenience.
variants:
  - name: RFC 8949 core deterministic encoding
    locator: RFC 8949 Section 4.2.1
    conflict: Lexical byte ordering of deterministic key encodings.
    disposition: Recommended profile basis, subject to architecture approval and complete Section 4.2.2 decisions.
  - name: RFC 8949 length-first deterministic encoding
    locator: RFC 8949 Section 4.2.3
    conflict: Encoded length is compared before bytes; differs from core ordering and matches several library canonical modes.
    disposition: Exclude unless a documented compatibility requirement outweighs the new-profile default; implementation convenience is not sufficient.
  - name: variation-tolerant decoding
    locator: RFC 8949 Section 5.4
    conflict: Can accept multiple serializations and normalize them internally.
    disposition: Suitable outside the strict artifact verifier boundary; do not use to decide digest acceptance.
  - name: preferred-plus draft
    locator: draft-ietf-cbor-serialization-06
    conflict: Proposes an evolving deterministic-serialization taxonomy beyond published RFC 8949.
    disposition: Record as current Work in Progress only; do not let it silently amend the accepted RFC profile.
  - name: tag 30 rational versus project-normalized rational
    locator: CBOR tag 30 specification, Detailed Semantics
    conflict: Tag 30 allows non-lowest terms; a project normal form would be a StatQED specialization.
    disposition: Tag 30 is a candidate only if the profile states and independently reviews the additional normal form.
  - name: tags 268-270 extended numbers
    locator: Extended Numbers, Detailed Semantics and Security Considerations
    conflict: Adds signed zero, infinities, and NaNs and leaves invalid-item handling unspecified.
    disposition: Exclude from the minimum exact-value profile.
concept_mapping:
  - source_concept: well-formed CBOR
    statqed_concept: raw byte parser succeeds without reserved additional-information values, premature end, stray break, or trailing data
    obligation: Keep this result distinct from validity, expectedness, schema conformance, profile conformance, and semantic validity.
  - source_concept: valid CBOR
    statqed_concept: well-formed item plus basic and tag-specific validity checks
    obligation: Validate on a lossless representation before host-language coercion.
  - source_concept: preferred serialization
    statqed_concept: minimal integer, length, tag, and admitted floating encodings
    obligation: Specify whether floats are admitted and how numeric tags cross representation boundaries.
  - source_concept: deterministic encoding
    statqed_concept: one named, versioned serialization profile
    obligation: Give the profile an exact identifier and do not conflate core and length-first ordering.
  - source_concept: CBOR tag
    statqed_concept: closed semantic constructor selected by exact tag number and content invariant
    obligation: Reject unknown tags in v1 or define a reviewed extension rule.
  - source_concept: map key equivalence
    statqed_concept: duplicate rejection over encoded and application-semantic equality
    obligation: Apply verified EID 8589 if NaNs can be keys.
quantifiers:
  - statement: For every admitted semantic StatQED value, encoding under one fixed profile must produce exactly one byte string.
    source_status: Not established by RFC 8949; project proof/test obligation.
  - statement: For every accepted byte string, strict validation must consume exactly one complete item and establish each validation layer in order.
    source_status: Specialization of RFC 8949 parsing and validity; framing and schema parts are project-original.
randomness_scopes: []
nonvacuity_witnesses:
  - name: map_order_conflict_witness
    value: A map with encoded keys whose bytewise lexical and length-first orders differ.
    purpose: Demonstrates that the two RFC 8949 deterministic variants cannot both define the same normative bytes.
  - name: rational_nonuniqueness_witness
    value: Tag 30 values [1, 2] and [2, 4].
    purpose: Both denote one half under the tag specification, which does not require lowest terms.
  - name: duplicate_key_loss_witness
    value: A raw map containing the same key twice with different values.
    purpose: Demonstrates why conversion to an ordinary host map before validation can erase a validity error.
strengthenings:
  - name: closed_tag_set
    class: strengthening_justified
    reason: Produces a versioned semantic boundary for content-addressed artifacts.
    approval_required: architecture and independent semantic review
  - name: strict_profile_rejection
    class: strengthening_justified
    reason: Prevents decoder normalization from making non-normative bytes digest-equivalent.
    approval_required: architecture, security, and independent checker review
  - name: normalized_rational_if_tag_30_is_selected
    class: strengthening_justified
    reason: Required for one semantic rational to have one normative representation; not granted by the tag specification.
    approval_required: RFC resolution and independent semantic review
weakenings:
  - name: allow_unknown_tags
    class: candidate_for_weakening
    effect: Enlarges the accepted language and can create semantics the schema does not understand.
    disposition: Defer to a future explicitly versioned extension profile.
  - name: accept_and_reencode_non_profile_input
    class: candidate_for_weakening
    effect: Variation tolerance may be useful at import boundaries but must not be confused with strict artifact acceptance.
    disposition: Keep outside the normative verifier path.
attribution:
  - kind: reproduced
    work: RFC 8949
    detail: CBOR syntax, validity layers, preferred serialization, and the two deterministic ordering variants are reproduced with exact section attribution.
  - kind: corrected
    work: RFC 8949 with verified EID 8589
    detail: NaN map-key equivalence incorporates the verified sign-bit correction.
  - kind: specialized
    work: RFC 8949
    detail: A closed strict StatQED profile would specialize permissive protocol choices; the specialization is not represented as an RFC mandate.
  - kind: original
    work: StatQED SQ-0005
    detail: Exact numeric normal forms, interval representation, profile identifiers, and checker error semantics remain project decisions.
  - kind: registry_observation
    work: IANA CBOR Tags
    detail: Candidate and excluded tags are based on the 2026-07-20 registry snapshot and must be rechecked before a later freeze.
