    "ADR-0002 — Lean 4 with pinned Mathlib as the initial normative proof backend",
    "ADR-0003 — Rust as reference operational backend rather than semantic authority",
    "ADR-0006 — thin R/Python/Julia frontends",
    "ADR-0008 — mode-specific minimal TCB and conditionally untrusted producers",
