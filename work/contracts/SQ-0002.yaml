  "sources": [
    "Current official Lean release/reference documentation, Lake documentation, and the exact Mathlib repository/toolchain metadata used by tested candidate revisions",
    "Official Rust release/channel, Cargo workspace/MSRV, target-platform, lint, and installation documentation",
    "Official Python release/support and packaging documentation plus the build/test tools proposed for the frontend",
    "Official R release, platform, package-development, R CMD check, and repository documentation",
    "Official Julia release/LTS, Pkg, package-testing, platform, and registry documentation",
    "Official Apache Arrow specifications and implementation support matrices relevant to future frontends/backends",
    "Official CBOR/CDDL standards and official documentation for candidate libraries used only as compatibility prototypes",
