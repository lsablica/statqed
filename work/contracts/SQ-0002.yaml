  },
  "acceptance": [
    "Every proposed development pin is identified by an exact immutable version or commit and has a successful reproducible prototype on a named environment",
    "Minimum supported versions and CI matrix entries are separate, justified recommendations rather than copies of the development pin",
    "Every current-version or support-policy statement cites a primary official source with retrieval date",
    "The report contains actual failures and rejected alternatives, not only the selected stack",
