  "assumptions": [
    "SQ-0002 selects recommendations; SQ-0003 and SQ-0004 create production Lean/Rust locks and workspaces",
    "Current/latest versions are unstable facts and must be re-queried from primary sources on the execution date",
    "A development/reference pin, a minimum supported version, and a CI test matrix are different decisions and must be reported separately",
    "A successful serialization-library prototype does not accept RFC-0001 or make its output the semantic oracle",
    "A successful Arrow prototype does not accept RFC-0006 or define logical-data identity",
    "Availability on one operating system or architecture does not imply support elsewhere",
    "Unavailable or untested combinations are reported as unknown or rejected, never silently inferred",
    "Prototype manifests and lock files live only under docs/research/toolchain-prototypes during this task"
  ],
  "steps": [
    "Run make check, make list-work, and git diff --check; record the starting commit and verify SQ-0002 is the sole READY task",
    "Mark SQ-0002 IN_PROGRESS atomically in its contract, backlog, status, and active-plan Progress section before substantive work",
    "Create docs/implementation/toolchain-compatibility.md with separate columns for proposed development pin, minimum support floor, CI matrix, tested platforms, evidence date, exact source, prototype result, license, maintenance/security risk, and rejected alternatives",
    "Create docs/research/toolchain-prototypes/matrix.json as a machine-readable inventory of every candidate combination, command, environment, result, and evidence artifact",
    "Create isolated prototype directories for Lean/Mathlib/Lake, Rust/Cargo, Python packaging/testing, R package tooling, Julia/Pkg, and candidate Arrow/CBOR/CDDL libraries; production paths remain untouched",
    "Create scripts/bootstrap/run_toolchain_probes.py as the reproducible entry point that runs available probes, validates matrix/report consistency, records exact version output, and fails on an unexplained recommended-pin failure",
    "For Lean, test exact Lean/Mathlib combinations in a minimal prototype, including dependency resolution, build, a trivial Mathlib import, cache behavior if used, and a proof/axiom inspection smoke test; distinguish a commit pin from a release label",
    "For Rust, test exact stable/MSRV candidates in a minimal prototype with workspace resolution, formatting, clippy, tests, target/platform information, unsafe-code policy, and candidate dependency compatibility",
    "For Python, R, and Julia, test the proposed development version and support-floor candidates using minimal package-native build/test/install probes without creating production frontend packages",
    "For Arrow and CBOR/CDDL candidates, test only build/runtime compatibility, deterministic-behavior observability, API suitability, licensing, active maintenance, and independent-lineage options needed by later tasks; do not select normative semantics",
    "Run actual probes on every available host/platform and record OS, architecture, container/runner image, locale, network/cache state, and timestamps; make no claim for unavailable macOS/Windows/architecture combinations and provide a concrete later validation plan",
    "Record all failed combinations, incompatibilities, security/licensing concerns, and rejected alternatives rather than deleting unsuccessful prototype evidence",
    "Recommend exact pins and support policies with a reasoned rollback/update policy; give SQ-0003 and SQ-0004 exact installation/build commands and expected smoke outputs",
    "Obtain independent source, Lean, Rust, frontend, interoperability/licensing, release/security, and integration review of the exact report and prototype manifest",
    "Run the full contract commands from a clean state, create work/reviews/SQ-0002.md and work/handoffs/SQ-0002.md, then transition SQ-0002 to DONE and expose the dependency-ready successor set atomically"
  ],
  "tests": [
    "make check and make list-work before and after the task-state transition",
    "git diff --check",
    "python3 -m json.tool docs/research/toolchain-prototypes/matrix.json",
    "python3 scripts/bootstrap/run_toolchain_probes.py --verify",
    "Fresh-directory rerun of every recommended-pin prototype with caches disabled or explicitly isolated",
    "Exact version-command capture and lock/commit digest capture for every recommendation",
    "A deliberately unsupported or altered candidate must be detected and recorded as failed rather than normalized to success",
    "Report/matrix consistency checks: every recommendation has a successful named probe and every failed probe appears in rejected/unknown evidence",
    "Dependency-license and known-advisory review for every recommended library",
    "No changes under production Lean, Rust, frontend, schema, conformance, registry, RFC, ADR, or workflow paths",
    "No Draft RFC or prototype behavior described as Accepted or implemented semantics"
  ],
