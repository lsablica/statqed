[workspace]
members = [
    "crates/statqed-cli",
    "crates/statqed-core",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85.1"
version = "0.1.0"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
unreachable = "deny"
unwrap_used = "deny"
